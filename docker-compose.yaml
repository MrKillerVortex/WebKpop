version: '3.8'
services:
    php-apache-environment:
        container_name: Kpop_Apache
        build:
            context: ./
            dockerfile: Dockerfile
        volumes:
            - ./site/:/var/www/html/
        ports:
            - 8001:80

    mariadb:
        container_name: KpopDB
        image: mariadb:latest
        environment:
            - MYSQL_ROOT_PASSWORD=Merlinismycat0192
            - MYSQL_USER=fortintechinfo42_admin
            - MYSQL_PASSWORD=Merlinismycat0192
            - MYSQL_DATABASE=fortinte_kpop
            - TZ=America/New_York
        volumes:
            - mariadb-volumes:/var/lib/mysql
        build:
            context: ./
            dockerfile: Dockerfile.mariadb
        ports:
            - 3308:3306

    adminer:
        container_name: KpopAdminer
        image: adminer
        restart: always
        ports:
            - 8149:8080
        environment:
            - TZ=America/New_York

volumes:
    mariadb-volumes: {}
